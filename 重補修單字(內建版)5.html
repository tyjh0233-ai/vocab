<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>單字冒險王 - 進階闖關版</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6dd5ed, #2193b0);
            --correct-color: #4CAF50;
            --wrong-color: #ff5252;
            --hp-color: #ff5e62;
            --text-gray: #7f8c8d;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 800px;
            text-align: center;
            position: relative;
        }

        /* 關卡選單 */
        .level-menu {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-top: 20px;
        }
        .level-card {
            background: white; border: 2px solid #e0e0e0; border-radius: 12px;
            padding: 15px; cursor: pointer; transition: 0.3s; position: relative;
        }
        .level-card.locked { background: #f5f5f5; cursor: not-allowed; opacity: 0.6; }
        .level-card.locked::after { content: "🔒"; position: absolute; top: 10px; right: 10px; }
        .level-card:not(.locked):hover { border-color: #2193b0; transform: translateY(-5px); }
        
        /* 單字檢索按鈕樣式 */
        .search-btn {
            position: absolute; top: 10px; left: 10px;
            width: 30px; height: 30px; border: 2px solid #4CAF50;
            border-radius: 6px; display: flex; align-items: center;
            justify-content: center; background: white; color: #4CAF50;
            font-size: 18px; transition: 0.2s; z-index: 10;
        }
        .search-btn:hover { background: #4CAF50; color: white; }

        .hp-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .hp-bar { height: 100%; background: var(--hp-color); width: 0%; transition: width 0.5s; }

        /* 重設按鈕樣式 (淡化處理) */
        .btn-reset-container {
            margin-top: 40px;
            text-align: center;
        }
        .btn-reset {
            background: none; border: none; color: #bdc3c7; font-size: 12px;
            cursor: pointer; text-decoration: underline; opacity: 0.5; transition: 0.3s;
        }
        .btn-reset:hover { opacity: 1; color: #e74c3c; }

        /* 測驗進度顯示圓點 */
        .progress-container { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #ddd; background: transparent; transition: 0.3s; }
        .dot.current { border-color: #2193b0; transform: scale(1.2); }
        .dot.correct { background: var(--correct-color); border-color: var(--correct-color); }
        .dot.wrong { background: var(--wrong-color); border-color: var(--wrong-color); }

        /* 測驗 UI */
        .quiz-header {
            background: var(--primary-gradient); padding: 30px 20px; border-radius: 12px;
            margin-bottom: 20px; color: white; min-height: 100px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .question { font-size: 32px; font-weight: 900; margin: 10px 0; }
        .correct-word-reveal { font-size: 28px; color: #ffe14d; margin-top: 10px; font-weight: bold; min-height: 35px; }
        
        .audio-group { display: flex; gap: 20px; margin-bottom: 15px; }
        .audio-btn {
            background: rgba(255,255,255,0.3); border: 2px solid white; color: white;
            width: 55px; height: 55px; border-radius: 50%; cursor: pointer; font-size: 24px;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .audio-btn:hover { background: white; color: #2193b0; }

        .option-column { display: flex; flex-direction: column; gap: 10px; }
        .option {
            width: 100%; padding: 15px; background: white; border: 2px solid #edf2f7;
            border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #d1d8e0; transition: 0.1s;
        }
        .option:active { transform: translateY(4px); box-shadow: 0 0px 0 #d1d8e0; }

        /* 放棄按鈕 */
        .btn-quit {
            background: none; border: none; color: #bdc3c7; font-size: 14px;
            margin-top: 25px; cursor: pointer; text-decoration: underline;
        }
        .btn-quit:hover { color: #95a5a6; }

        /* 單字對話框樣式 */
        #word-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center;
            align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 15px;
            max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto;
            text-align: left; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-item {
            display: flex; justify-content: space-between; border-bottom: 1px solid #eee;
            padding: 8px 0; font-size: 18px;
        }
        .modal-close {
            background: #2193b0; color: white; border: none; width: 100%;
            padding: 10px; border-radius: 8px; margin-top: 15px; cursor: pointer;
        }

        .hidden { display: none !important; }
        #sad-face { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; display: none; z-index: 1000; animation: fadeInOut 1s forwards; }
        @keyframes fadeInOut { 0%, 100% { opacity: 0; } 20%, 80% { opacity: 1; } }
        #score-tag { position: absolute; top: 10px; right: 20px; font-size: 18px; font-weight: bold; color: #2193b0; }
    </style>
</head>
<body>

<div class="container">
    <div id="sad-face">😢</div>
    <div id="score-tag" class="hidden">積分: 0</div>

    <div id="step-1">
        <h1 style="color:#2193b0;">單字冒險王</h1>
        <div class="level-menu" id="level-menu"></div>
        <div class="btn-reset-container">
            <button class="btn-reset" onclick="resetGame()">重設所有闖關紀錄</button>
        </div>
    </div>

    <div id="step-2" class="hidden">
        <div class="progress-container" id="progress-dots"></div>
        <div class="quiz-header">
            <div id="audio-container" class="audio-group">
                <button id="btn-replay" class="audio-btn hidden" onclick="speakCurrentWord()">🔊</button>
                <button id="btn-audio-a" class="audio-btn hidden" onclick="playTriple(0)">A</button>
                <button id="btn-audio-b" class="audio-btn hidden" onclick="playTriple(1)">B</button>
                <button id="btn-audio-c" class="audio-btn hidden" onclick="playTriple(2)">C</button>
            </div>
            <h1 id="q-text" class="question"></h1>
            <div id="correct-reveal-box" class="correct-word-reveal"></div>
        </div>
        <div id="options-box" class="option-column"></div>
        <button class="btn-quit" onclick="location.reload()">放棄本次測驗</button>
    </div>

    <div id="step-3" class="hidden">
        <h1 id="final-msg"></h1>
        <div id="final-score-val" style="font-size: 48px; color: #2193b0;">0</div>
        <button onclick="location.reload()" style="margin-top:20px; padding:15px 30px; background:#5cb85c; color:white; border:none; border-radius:8px; cursor:pointer;">返回選單</button>
    </div>
</div>

<div id="word-modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="modal-title" style="margin-top:0; color:#2193b0; border-bottom: 2px solid #2193b0; padding-bottom:5px;">單字檢索</h3>
        <div id="modal-list"></div>
        <button class="modal-close" onclick="closeModal()">關閉</button>
    </div>
</div>

<script>
    const wordBank = {
        "L1-1": [{en: "individual", zh: "個別的"}, {en: "record", zh: "記錄"}, {en: "rearrange", zh: "重新安排"}, {en: "seize", zh: "把握;抓住"}, {en: "intensive", zh: "密集的"}, {en: "routine", zh: "例行公事"}, {en: "electronic", zh: "電子的"}, {en: "advance", zh: "進步;進展"}, {en: "sufficient", zh: "足夠的"}, {en: "equip", zh: "配備"}],
        "L1-2": [{en: "professional", zh: "職業的;專業的"}, {en: "equipment", zh: "設備;裝備"}, {en: "broadcast", zh: "播送"}, {en: "ideal", zh: "理想的"}, {en: "global", zh: "全球的"}, {en: "overseas", zh: "海外地"}, {en: "sacrifice", zh: "犧牲"}, {en: "imagine", zh: "想像"}, {en: "have no choice but to", zh: "不得不"}, {en: "challenge", zh: "挑戰"}],
        "L1-3": [{en: "make it up to sb", zh: "補償某人"}, {en: "stand for", zh: "代表"}, {en: "key to", zh: "實現的關鍵"}, {en: "make a living", zh: "謀生"}, {en: "as a matter of fact", zh: "事實上"}, {en: "at least", zh: "至少"}, {en: "individual", zh: "個別的"}, {en: "record", zh: "記錄"}, {en: "rearrange", zh: "重新安排"}, {en: "seize", zh: "把握;抓住"}],
        "L3-1": [{en: "suspiciously", zh: "懷疑地"}, {en: "scientist", zh: "科學家"}, {en: "claim", zh: "聲稱;主張"}, {en: "replace", zh: "取代;代替"}, {en: "disease", zh: "疾病"}, {en: "cancer", zh: "癌症"}, {en: "overweight", zh: "過重的"}, {en: "production", zh: "生產;製作"}, {en: "climate", zh: "氣候"}, {en: "environment", zh: "環境"}],
        "L3-2": [{en: "brand", zh: "品牌"}, {en: "advertisement", zh: "廣告"}, {en: "consumer", zh: "消費者"}, {en: "consume", zh: "花費;消耗"}, {en: "convinced", zh: "確信的"}, {en: "convince", zh: "使確信"}, {en: "favor", zh: "贊同;支持"}, {en: "switch", zh: "改變;轉換"}, {en: "gradually", zh: "逐漸地"}, {en: "option", zh: "選擇"}],
        "L3-3": [{en: "attempt", zh: "嘗試"}, {en: "sustainable", zh: "可持續的"}, {en: "as well", zh: "也"}, {en: "take steps", zh: "採取行動"}, {en: "in favor of", zh: "支持;贊成"}, {en: "when it comes to", zh: "當提及"}, {en: "suspiciously", zh: "懷疑地"}, {en: "scientist", zh: "科學家"}, {en: "claim", zh: "聲稱;主張"}, {en: "replace", zh: "取代;代替"}],
        "L5-1": [{en: "bill", zh: "鈔票"}, {en: "option", zh: "選擇"}, {en: "enable", zh: "使能夠"}, {en: "benefit", zh: "益處"}, {en: "reward", zh: "獎勵"}, {en: "announcement", zh: "公告"}, {en: "likewise", zh: "同樣地"}, {en: "appealing", zh: "吸引人的"}, {en: "especially", zh: "尤其"}, {en: "elderly", zh: "年長的"}],
        "L5-2": [{en: "concerned", zh: "擔心的"}, {en: "signal", zh: "訊號"}, {en: "electricity", zh: "電"}, {en: "electric", zh: "電的"}, {en: "connection", zh: "聯結"}, {en: "opponent", zh: "反對者"}, {en: "stable", zh: "穩定的"}, {en: "method", zh: "方法"}, {en: "burden", zh: "負擔"}, {en: "system", zh: "系統"}],
        "L5-3": [{en: "for short", zh: "簡稱"}, {en: "go in for", zh: "喜愛"}, {en: "so far", zh: "到目前為止"}, {en: "be used to", zh: "習慣於"}, {en: "last but not least", zh: "最後同樣重要"}, {en: "out of order", zh: "故障"}, {en: "bill", zh: "鈔票"}, {en: "option", zh: "選擇"}, {en: "enable", zh: "使能夠"}, {en: "benefit", zh: "益處"}]
    };

    let progress = JSON.parse(localStorage.getItem('wordMasterHP')) || { "L1-1": 0 };
    let quizList = [], currentIndex = 0, score = 0, currentLevelKey = "";
    let questionResults = [];

    function playFart() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.5);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
    }

    function speak(text, cb) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.8;
        if(cb) u.onend = cb;
        window.speechSynthesis.speak(u);
    }

    function speakCurrentWord() { speak(quizList[currentIndex].originalEn); }
    function playTriple(idx) { speak(quizList[currentIndex].triple[idx]); }

    function showWords(e, key) {
        e.stopPropagation();
        const modal = document.getElementById('word-modal');
        const listContainer = document.getElementById('modal-list');
        document.getElementById('modal-title').innerText = `${key} 單字檢索`;
        listContainer.innerHTML = "";
        
        wordBank[key].forEach(item => {
            const div = document.createElement('div');
            div.className = 'modal-item';
            div.innerHTML = `<strong>${item.en}</strong> <span>${item.zh}</span>`;
            listContainer.appendChild(div);
        });
        
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('word-modal').style.display = 'none';
    }

    // 重設遊戲功能
    function resetGame() {
        if(confirm("警告：確定要清除所有闖關紀錄並重新鎖定關卡嗎？")) {
            localStorage.removeItem('wordMasterHP');
            location.reload();
        }
    }

    function initMenu() {
        const menu = document.getElementById('level-menu');
        menu.innerHTML = "";
        const keys = Object.keys(wordBank);
        keys.forEach((key, idx) => {
            // 邏輯：第一關永遠不鎖，其餘關卡需前一關過關（數值 >= 1）
            const isLocked = idx > 0 && (progress[keys[idx-1]] || 0) < 1;
            const card = document.createElement('div');
            card.className = `level-card ${isLocked ? 'locked' : ''}`;
            const hp = (progress[key] || 0) * 20;
            
            const searchIcon = isLocked ? '' : `<div class="search-btn" onclick="showWords(event, '${key}')">☰</div>`;
            
            card.innerHTML = `
                ${searchIcon}
                <h3>${key}</h3>
                <div class="hp-container">
                    <div class="hp-bar" style="width:${hp}%"></div>
                </div>`;
            
            if(!isLocked) card.onclick = () => startLevel(key);
            menu.appendChild(card);
        });
    }

    function startLevel(key) {
        currentLevelKey = key;
        const words = wordBank[key];
        currentIndex = 0; score = 0; questionResults = [];
        
        let pool = [];
        const shuffled = [...words].sort(() => 0.5 - Math.random());
        shuffled.slice(0,5).forEach(w => pool.push({ type:1, q:w.en, a:w.zh, originalEn:w.en }));
        shuffled.slice(5,10).forEach(w => pool.push({ type:2, q:w.zh, a:w.en, originalEn:w.en }));
        shuffled.slice(0,5).forEach(w => pool.push({ type:3, q:"", a:w.zh, originalEn:w.en }));
        shuffled.slice(5,10).forEach(w => {
            let others = words.filter(x => x.en !== w.en).sort(() => 0.5 - Math.random()).slice(0,2);
            let triple = [w.en, others[0].en, others[1].en].sort(() => 0.5 - Math.random());
            let ans = ["A","B","C"][triple.indexOf(w.en)];
            pool.push({ type:4, q:w.zh, a:ans, originalEn:w.en, triple: triple });
        });

        quizList = pool.sort(() => 0.5 - Math.random());
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');
        document.getElementById('score-tag').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        if(currentIndex >= 20) return endLevel();
        
        const dots = document.getElementById('progress-dots');
        dots.innerHTML = "";
        for(let i=0; i<20; i++) {
            const d = document.createElement('div');
            let statusClass = "";
            if (i === currentIndex) statusClass = "current";
            else if (questionResults[i] === true) statusClass = "correct";
            else if (questionResults[i] === false) statusClass = "wrong";
            d.className = `dot ${statusClass}`;
            dots.appendChild(d);
        }

        const q = quizList[currentIndex];
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('correct-reveal-box').innerText = "";
        document.getElementById('score-tag').innerText = `積分: ${score}`;

        document.getElementById('btn-replay').classList.toggle('hidden', q.type !== 3);
        document.getElementById('btn-audio-a').classList.toggle('hidden', q.type !== 4);
        document.getElementById('btn-audio-b').classList.toggle('hidden', q.type !== 4);
        document.getElementById('btn-audio-c').classList.toggle('hidden', q.type !== 4);

        if(q.type === 3) speak(q.originalEn);
        if(q.type === 4) {
            speak(q.triple[0], () => setTimeout(()=>speak(q.triple[1], () => setTimeout(()=>speak(q.triple[2]), 400)), 400));
        }

        const box = document.getElementById('options-box');
        box.innerHTML = "";
        let opts = q.type === 4 ? ["A","B","C"] : [q.a];
        if(q.type !== 4) {
            let wrongPool = wordBank[currentLevelKey].map(i => q.type === 2 ? i.en : i.zh).filter(i => i !== q.a);
            while(opts.length < 3) {
                let r = wrongPool[Math.floor(Math.random()*wrongPool.length)];
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => 0.5 - Math.random());
        }

        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'option';
            b.innerText = o;
            b.onclick = () => checkAnswer(o, q);
            box.appendChild(b);
        });
    }

    function checkAnswer(user, q) {
        const isCorrect = user === q.a;
        questionResults[currentIndex] = isCorrect;
        if(isCorrect) {
            score += 5;
            confetti({ particleCount: 60, spread: 50, origin: { y: 0.8 } });
            if(q.type === 3 || q.type === 4) document.getElementById('correct-reveal-box').innerText = q.originalEn;
            speak(q.originalEn);
        } else {
            document.getElementById('sad-face').style.display = 'block';
            playFart();
            setTimeout(() => document.getElementById('sad-face').style.display = 'none', 1000);
        }
        currentIndex++;
        setTimeout(renderQuestion, 1200);
    }

    function endLevel() {
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('step-3').classList.remove('hidden');
        document.getElementById('final-score-val').innerText = score;
        
        if(score >= 85) {
            document.getElementById('final-msg').innerText = score === 100 ? "👑 完美達成！血條補滿！" : "🎉 恭喜過關！血條增加！";
            progress[currentLevelKey] = Math.min((progress[currentLevelKey] || 0) + 1, 5);
            
            const keys = Object.keys(wordBank);
            const nextIdx = keys.indexOf(currentLevelKey) + 1;
            if(nextIdx < keys.length && !progress[keys[nextIdx]]) progress[keys[nextIdx]] = 0;
        } else {
            document.getElementById('final-msg').innerText = "再接再厲！需 85 分才能過關補血";
            progress[currentLevelKey] = Math.max((progress[currentLevelKey] || 0) - 1, 0);
        }
        localStorage.setItem('wordMasterHP', JSON.stringify(progress));
    }

    initMenu();
</script>
</body>
</html>
